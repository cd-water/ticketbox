spring:
  application:
    name: ticketbox
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ticketbox?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:ticketmysql}
    password: ${DB_PASSWORD:ticketmysql}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:ticketredis}

server:
  port: ${SERVER_PORT:8888}

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:24h}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:ticketbox}
  order:
    expiry: ${ORDER_EXPIRY:15m}
    sweep-interval: ${ORDER_SWEEP_INTERVAL:60000}
  payment:
    callback-secret: ${PAYMENT_CALLBACK_SECRET}
    callback-delay: ${PAYMENT_CALLBACK_DELAY:300ms}
  ticket:
    qr-secret: ${TICKET_QR_SECRET}
