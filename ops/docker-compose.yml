name: ticketbox

services:
  mysql:
    image: mysql:8.0.46
    container_name: ticketbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ticketmysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketbox}
      MYSQL_USER: ${MYSQL_USER:-ticketmysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ticketmysql}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ticketbox-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.11
    container_name: ticketbox-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ticketredis}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticketbox-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ticketbox-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ticketminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ticketminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ticketbox-network

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ticketbox-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      # dev profile seeds the demo admin; set to empty for a production deployment.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-dev}
      DB_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER:-ticketmysql}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ticketmysql}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ticketredis}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ticketminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ticketminio}
      MINIO_BUCKET: ticketbox
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-0123456789abcdef0123456789abcdef}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-dev-callback-secret-change-me-0123456789abcdef}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:-dev-qr-secret-change-me-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ticketadmin}
    ports:
      - "8900:8900"
    networks:
      - ticketbox-network

volumes:
  mysql-data:
    name: mysql-data
  redis-data:
    name: redis-data
  minio-data:
    name: minio-data

networks:
  ticketbox-network:
    name: ticketbox-network
    driver: bridge
